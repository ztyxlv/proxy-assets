      - PROCESS-NAME,TradingView.exe

  - name: finance-domain
    type: domain
    rulesets:
      - name: quixoticheart-paypal
        url: https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/paypal.list
    includes:
      - +.wise.com

  - name: google-domain
    type: domain
