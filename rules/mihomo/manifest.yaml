global:
  excludes:
    domain:
      - "*"

rules:
  - name: real-ip-domain
    type: domain
    rulesets:
      - name: dustinwin-fakeip-filter
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.list

  - name: direct-domain
    type: domain
    rulesets:
      - name: dustinwin-private
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/private.list

  - name: direct-ipcidr
    type: ipcidr
    rulesets:
      - name: dustinwin-privateip
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.list

  - name: direct-classical
    type: classical
    rules:
      - PROCESS-NAME,qbittorrent.exe
      - PROCESS-NAME,localsend_app.exe

  - name: united-states-domain
    type: domain
    rules:
      - +.bls.gov
      - +.federalreserve.gov
      - voice.google.com

  - name: korea-domain
    type: domain
    rules:
      - +.example.com

  - name: japan-domain
    type: domain
    rules:
      - +.example.com

  - name: china-domain
    type: domain
    rules:
      - +.example.com

  - name: ai-domain
    type: domain
    rulesets:
      - name: dustinwin-ai
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ai.list

  - name: ai-classical
    type: classical
    rulesets:
      - name: sukka-apple-intelligence
        url: https://ruleset.skk.moe/Clash/non_ip/apple_intelligence.txt

  - name: games-cn-domain
    type: domain
    rulesets:
      - name: dustinwin-games-cn
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games-cn.list

      - name: sukka-game-download
        url: https://ruleset.skk.moe/Clash/domainset/game-download.txt

  - name: games-domain
    type: domain
    rulesets:
      - name: dustinwin-games
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/games.list
    includes:
      - +.crazygames.com
      - +.poki.com
      - +.itch.io

  - name: music-cn-domain
    type: domain
    rules:
      - +.music.apple.com
      - +.applemusic.com

  - name: music-domain
    type: domain
    rulesets:
      - name: dustinwin-spotify
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/spotify.list

  - name: youtube-domain
    type: domain
    rulesets:
      - name: dustinwin-youtube
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/youtube.list

  - name: bilibili-domain
    type: domain
    rulesets:
      - name: dustinwin-bilibili
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/bilibili.list

  - name: videos-domain
    type: domain
    rulesets:
      - name: dustinwin-netflix
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/netflix.list

      - name: dustinwin-disney
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/disney.list

      - name: dustinwin-appletv
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/appletv.list

  - name: videos-ipcidr
    type: ipcidr
    rulesets:
      - name: dustinwin-netflixip
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/netflixip.list

  - name: social-domain
    type: domain
    rulesets:
      - name: dustinwin-tiktok
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/tiktok.list
    includes:
      - +.x.com
      - +.reddit.com      

  - name: telegram-ipcidr
    type: ipcidr
    rulesets:
      - name: dustinwin-telegramip
        url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/telegramip.list

  - name: telegram-classical
    type: classical
    rules:
      - PROCESS-NAME,Telegram.exe

  - name: messaging-domain
    type: domain
    rules:
      - +.line.me
      - +.whatsapp.com

  - name: messaging-classical
    type: classical
    rules:
      - PROCESS-NAME,WhatsApp.Root.exe
      - PROCESS-NAME,LINE.exe

  - name: shopping-domain
    type: domain
    rulesets:
      - name: quixoticheart-ecommerce
        url: https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/ecommerce.list

  - name: crypto-domain
    type: domain
    rulesets:
      - name: quixoticheart-crypto
        url: https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/meta/domain/crypto.list
    excludes:
      - +.coinglass.com
      - +.cryptoquant.com

  - name: crypto-classical
    type: classical
    rules:
      - PROCESS-NAME,Binance.exe
      - PROCESS-NAME,OKX.exe

  - name: stocks-domain
    type: domain
    rules:
      - +.example.com

  - name: markets-domain
    type: domain
